name: Feature request
description: Suggest a new capability or a change to existing behaviour.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Some features are already planned for later releases (SARIF output, policy files and exceptions, runtime browser profiles, configurable remote retrieval). If yours is one of them, say how you'd use it.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and where monkeypatchlist gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The behaviour, flag, config key or output you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What you do today instead.
